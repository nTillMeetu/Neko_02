name: Bug report
description: Something in the usage panel does not work as expected
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please redact account balances, names, phone
        numbers and API key identifiers from screenshots and logs.
  - type: input
    id: dsh-version
    attributes:
      label: DeepSeek Harness version
      description: The desktop app version (e.g. 0.2.1-rc.5)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version or commit
      description: The version in package.json, or the git commit you installed
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open 设置 → 账号与余额
        2. Click 查询用量
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What you saw instead, including any error message
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots (optional)
      description: Redact personal data before pasting.
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: Checklist
      options:
        - label: I restarted DeepSeek Harness after installing the plugin.
          required: true
        - label: I removed tokens, balances, names and other personal data from this report.
          required: true
